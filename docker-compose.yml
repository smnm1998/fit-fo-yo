services:
  postgres:
    image: postgres:16
    container_name: fitfoyo-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitfoyo
    ports:
      - '5432:5432'
    volumes:
      - fitfoyo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fitfoyo']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitfoyo-pgdata:
