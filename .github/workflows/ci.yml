name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# 같은 브랜치에 새 커밋이 오면 이전 CI 자동 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint / Type Check / Build / Migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fitfoyo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d fitfoyo_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # CI 임시 PG 컨테이너로 연결 (host: localhost, 위 services 매핑)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/fitfoyo_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/fitfoyo_ci
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply migrations to CI database
        run: pnpm --filter @fitfoyo/database db:deploy

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
